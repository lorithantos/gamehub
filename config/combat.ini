# Damage, and what it is worth against what.
#
# THESE ARE OUR NUMBERS. Prior art was read to check that the SHAPE is right --
# a percentage table indexed by weapon and armour, and a blast that falls off
# with distance, are how this genre has worked since 1992 -- and not one value
# was copied. Anyone wanting to compare against a shipped game can do that work
# themselves; this project is not going to depend on it.
#
# RATES ARE PER SECOND, NEVER PER TICK. A rate written per tick silently
# rescales the whole game when the tick changes, and the tick is one line of
# config/scale.ini away from changing. The loop multiplies by secondsPerTick.

[rates]

# Health lost per second while inside a threat's reach, before armour.
damagePerSecond = 0.10

# What a unit at the top of the rank table recovers per second, anywhere.
# Deliberately under damagePerSecond: self-healing is a rate, and a rate can be
# overwhelmed. A veteran under sustained fire still falls under its threshold
# and still needs a pad.
selfHealPerSecond = 0.05

# What standing on a repair pad adds. On TOP of any self-healing, because the
# armory is faster rather than exclusive -- which is what lets a veteran mend on
# the walk and turn back before it arrives.
repairPerSecond = 0.35

[armour]
# Named for what they are, in the order the tables below use.
order = unarmoured, light, plated, structure

[weapon.rifle]
# Percent of base damage against each armour class, in [armour] order.
# Shreds infantry, useless against armour. The reason infantry needs a screen.
versus = 100, 35, 10, 15
blastCells = 0
baseDamage = 1.0

[weapon.autocannon]
# The light-vehicle answer. Hurts infantry, bounces off plate.
versus = 70, 100, 35, 25
blastCells = 1
baseDamage = 1.4

[weapon.cannon]
# Anti-armour and anti-building. Poor against anything small and quick.
versus = 40, 75, 100, 80
blastCells = 1
baseDamage = 3.0

[weapon.rocket]
# Beats plate and structures both, which is why it wants countering by speed
# rather than by armour.
versus = 30, 60, 110, 100
blastCells = 2
baseDamage = 3.5

[weapon.flame]
# Area denial. Terrible against armour, cruel to everything else.
versus = 120, 50, 15, 60
blastCells = 2
baseDamage = 1.2

[blast]
# Damage falls to this fraction of itself per cell from the centre. Halving is
# the traditional shape and is an integer shift; it makes positioning a real
# decision because one cell out is worth half as much.
falloffPerCell = 0.5

[rank]
# Contribution earned per point of damage dealt, and the lump for a kill.
# Damage-dealt rather than last-hit, because blast makes several units
# contributing to one death the normal case rather than the edge -- see the
# janet item on attribution, which is the open question here.
perDamage = 1.0
killBonus = 25.0

# Exposed-time accrual, which measures PRESENCE rather than contribution and is
# a stand-in until damage exists. Kept so the demo still promotes; it is not the
# intended rule.
perExposedSecond = 0.5
