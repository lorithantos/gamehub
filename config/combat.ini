# Damage, and what it is worth against what.
#
# THESE ARE OUR NUMBERS. Prior art was read to check that the SHAPE is right --
# a percentage table indexed by weapon and armour, and a blast that falls off
# with distance, are how this genre has worked since 1992 -- and not one value
# was copied. Anyone wanting to compare against a shipped game can do that work
# themselves; this project is not going to depend on it.
#
# RATES ARE PER SECOND, NEVER PER TICK. A rate written per tick silently
# rescales the whole game when the tick changes, and the tick is one line of
# config/scale.ini away from changing. The loop multiplies by secondsPerTick.

[rates]

# Health lost per second while inside a threat's reach, before armour.
damagePerSecond = 0.10

# What a unit at the top of the rank table recovers per second, anywhere.
# Deliberately under damagePerSecond: self-healing is a rate, and a rate can be
# overwhelmed. A veteran under sustained fire still falls under its threshold
# and still needs a pad.
selfHealPerSecond = 0.05

# What standing on a repair pad adds. On TOP of any self-healing, because the
# armory is faster rather than exclusive -- which is what lets a veteran mend on
# the walk and turn back before it arrives.
repairPerSecond = 0.35

[armour]
# Named for what they are, in the order the tables below use.
order = unarmoured, light, plated, structure

# baseDamage is HIT POINTS PER SHOT against 100% armour at the centre of the
# blast. Health is a fraction on the seam, but damage is a quantity here, so a
# tank and a rifleman can differ in how much there is to lose.

[weapon.rifle]
# Percent of base damage against each armour class, in [armour] order.
# Shreds infantry, useless against armour. The reason infantry needs a screen.
versus = 100, 35, 10, 15
blastCells = 0
baseDamage = 6

[weapon.autocannon]
# The light-vehicle answer. Hurts infantry, bounces off plate.
versus = 70, 100, 35, 25
blastCells = 1
baseDamage = 10

[weapon.cannon]
# Anti-armour and anti-building. Poor against anything small and quick.
versus = 40, 75, 100, 80
blastCells = 1
baseDamage = 60

[weapon.rocket]
# Beats plate and structures both, which is why it wants countering by speed
# rather than by armour.
versus = 30, 60, 110, 100
blastCells = 2
baseDamage = 70

[weapon.flame]
# Area denial. Terrible against armour, cruel to everything else.
versus = 120, 50, 15, 60
blastCells = 2
baseDamage = 8

[units]
# What can be enlisted, by name. Each has a section below carrying its weapon,
# its armour class, its reach in cells, how often it fires, and how much there
# is to lose. Range is octile step cost, the same measure exposure uses.
names = rifleman, buggy, tank, rocketbike

[unit.rifleman]
weapon = rifle
armour = unarmoured
range = 4
shotsPerSecond = 2
hitPoints = 50

[unit.buggy]
weapon = autocannon
armour = light
range = 5
shotsPerSecond = 3
hitPoints = 120

[unit.tank]
weapon = cannon
armour = plated
range = 6
shotsPerSecond = 0.5
hitPoints = 400

[unit.rocketbike]
# Fragile and fast-hitting: the unit a tank should shoot first, because what
# matters in a fight is who can hurt you soonest, not who has the most to lose.
weapon = rocket
armour = light
range = 6
shotsPerSecond = 0.75
hitPoints = 90

[blast]
# Damage falls to this fraction of itself per cell from the centre. Halving is
# the traditional shape and is an integer shift; it makes positioning a real
# decision because one cell out is worth half as much.
falloffPerCell = 0.5

[rank]
# Contribution per point of damage dealt, and the lump for landing the fatal
# blow. Credit is BY LAST HIT: whoever was resolving damage at death takes the
# bonus. That is a stochastic estimator of damage share -- deal sixty percent
# and land about sixty percent of the kills -- so it agrees with exact
# accounting in expectation while needing no per-target bookkeeping. Measured:
# a unit dealing 75% of the damage took 75.5% of 400 kills.
#
# THESE TWO MUST BE COMPARABLE OR THE MODEL COLLAPSES INTO THE OLD ONE. Health
# is a 0..1 fraction, so killing a unit outright is ONE point of damage. At
# perDamage 1 against a killBonus of 25 the bonus was twenty-five times
# everything else, and "rank measures contribution" would have quietly meant
# "rank measures kills" -- exactly the model this replaced. Set so a solo kill
# earns about half from the damage and half from landing it.
#
# It is also a symptom: health being a FRACTION rather than a QUANTITY is what
# makes these numbers need to know about each other. Units differing in how
# much there is to lose would fix it properly.
perDamage = 25.0
killBonus = 25.0

# Exposed-time accrual, which measures PRESENCE rather than contribution and is
# a stand-in until damage exists. Kept so the demo still promotes; it is not the
# intended rule.
perExposedSecond = 0.5
