# What a cell is worth, and what a tick is worth.
#
# These two numbers were missing, and their absence was not neutral. Movement is
# one cell per tick; a tick was a sixtieth of a second because that is what a
# render loop runs at; nobody multiplied them. Units crossed ground at sixty
# cells a second, and the whole guard demo -- six promotions, four repair trips,
# a rotation -- was over in five and a third seconds.
#
# Pin any two of {metres per cell, seconds per tick, cells per second} and the
# third is determined. The two below are the chosen ones; speed falls out of the
# movement rule.
#
# The test of a calibration is that all three read plausibly AT ONCE:
#
#   512 cells edge to edge      128 s   = 2:08     the target
#   512 cells corner to corner  181 s   = 3:01
#   512 cells in metres         1.02 km             a battlefield
#   fastest unit                29 km/h             a tracked vehicle
#
# Change secondsPerTick and every one of those moves together, which is the
# point of it being here rather than spelled three times in the source.

[scale]

# One simulation step. Four a second. The viewer interpolates between them, so
# this is the rate the world CHANGES at, not the rate anything is drawn at.
secondsPerTick = 0.25

# Ground per cell. Two metres makes a 512-square map a kilometre across and
# puts a unit's footprint at roughly a vehicle.
metresPerCell = 2.0
